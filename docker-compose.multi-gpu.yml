version: '3.8'

# Multi-GPU Docker Compose Configuration
# Hardware: 96GB RAM, RTX 5080 (12GB), RTX 4090 (24GB)
# Supports distributed training across GPUs

services:
  # Backend monitoring API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: french-llm-backend-multi
    command: python dashboard/server.py
    ports:
      - "8000:8000"
    volumes:
      - ./data_clean:/workspace/data_clean
      - ./trained_models:/workspace/trained_models
      - ./scripts:/workspace/scripts
      - ./dashboard:/workspace/dashboard
      - ./logs:/workspace/logs
    environment:
      - CUDA_VISIBLE_DEVICES=0,1
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - PYTORCH_DISTRIBUTED_DEBUG=INFO
      - MASTER_ADDR=training-master
      - MASTER_PORT=29500
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - llm-network
    depends_on:
      - training-master

  # Primary GPU node (RTX 4090 - 24GB) - Master
  training-master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: french-llm-training-master
    command: >
      python -m torch.distributed.launch
      --nproc_per_node=1
      --nnodes=2
      --node_rank=0
      --master_addr=training-master
      --master_port=29500
      scripts/train_subtitles_transformer_ddp.py
      --max-steps 250000
      --batch-size 12
      --gradient-accumulation-steps 2
      --learning-rate 1e-4
      --warmup-steps 1000
      --resume-from trained_models/runs/french_medium_base_60k/checkpoint_step_60000.pt
    volumes:
      - ./data_clean:/workspace/data_clean
      - ./trained_models:/workspace/trained_models
      - ./scripts:/workspace/scripts
      - ./logs:/workspace/logs
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - PYTORCH_DISTRIBUTED_DEBUG=INFO
      - MASTER_ADDR=training-master
      - MASTER_PORT=29500
      - RANK=0
      - WORLD_SIZE=2
      - OMP_NUM_THREADS=4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "1"  # RTX 4090
              capabilities: [gpu]
    networks:
      - llm-network
    shm_size: 32gb
    cpus: '8'
    mem_limit: 48gb
    profiles:
      - multi-gpu

  # Secondary GPU node (RTX 5080 - 12GB) - Worker
  training-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: french-llm-training-worker
    command: >
      python -m torch.distributed.launch
      --nproc_per_node=1
      --nnodes=2
      --node_rank=1
      --master_addr=training-master
      --master_port=29500
      scripts/train_subtitles_transformer_ddp.py
      --max-steps 250000
      --batch-size 12
      --gradient-accumulation-steps 2
      --learning-rate 1e-4
      --warmup-steps 1000
      --resume-from trained_models/runs/french_medium_base_60k/checkpoint_step_60000.pt
    volumes:
      - ./data_clean:/workspace/data_clean
      - ./trained_models:/workspace/trained_models
      - ./scripts:/workspace/scripts
      - ./logs:/workspace/logs
    environment:
      - CUDA_VISIBLE_DEVICES=1
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:256
      - PYTORCH_DISTRIBUTED_DEBUG=INFO
      - MASTER_ADDR=training-master
      - MASTER_PORT=29500
      - RANK=1
      - WORLD_SIZE=2
      - OMP_NUM_THREADS=4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "0"  # RTX 5080
              capabilities: [gpu]
    networks:
      - llm-network
    depends_on:
      - training-master
    shm_size: 16gb
    cpus: '4'
    mem_limit: 32gb
    profiles:
      - multi-gpu

  # Frontend React dashboard
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: french-llm-frontend-multi
    ports:
      - "5174:5174"
    volumes:
      - ./dashboard/web:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge

volumes:
  training_cache:
    driver: local

