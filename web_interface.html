<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🇫🇷 French GPT-2 - Test Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .content { padding: 40px; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        .stat-value { font-size: 1.5em; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; margin-top: 5px; font-size: 0.9em; }
        
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        textarea, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1em;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        button:active { transform: translateY(0); }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .output {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Monaco', 'Courier New', monospace;
            color: #333;
            margin-bottom: 20px;
        }
        
        .status {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .status.error {
            background: #fee;
            color: #c33;
            border: 1px solid #fcc;
            display: block;
        }
        .status.success {
            background: #efe;
            color: #3c3;
            border: 1px solid #cfc;
            display: block;
        }
        .status.loading {
            background: #eef;
            color: #33c;
            border: 1px solid #ccf;
            display: block;
        }
        
        .spinner {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: currentColor;
            border-radius: 50%;
            margin-right: 8px;
            animation: spin 1s infinite;
        }
        @keyframes spin { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .range-value {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇫🇷 French GPT-2</h1>
            <p>Test du modèle en temps réel</p>
        </div>
        
        <div class="content">
            <div class="stats">
                <div class="stat">
                    <div class="stat-value">124M</div>
                    <div class="stat-label">Paramètres</div>
                </div>
                <div class="stat">
                    <div class="stat-value">80,000</div>
                    <div class="stat-label">Étapes d'entraînement</div>
                </div>
                <div class="stat">
                    <div class="stat-value">3.10</div>
                    <div class="stat-label">Loss final</div>
                </div>
                <div class="stat">
                    <div class="stat-value">85.5M</div>
                    <div class="stat-label">Tokens d'entraînement</div>
                </div>
            </div>
            
            <div id="status" class="status"></div>
            
            <div class="form-group">
                <label for="prompt">Prompt (commençons par du texte en français):</label>
                <textarea id="prompt" placeholder="Ex: Bonjour, comment allez-vous...">Bonjour, </textarea>
            </div>
            
            <div class="controls">
                <div class="form-group">
                    <label for="maxLength">Longueur max: <span id="maxLengthValue">100</span></label>
                    <input type="range" id="maxLength" min="10" max="256" value="100">
                </div>
                <div class="form-group">
                    <label for="temperature">Température: <span id="tempValue">0.7</span></label>
                    <input type="range" id="temperature" min="0.1" max="1.0" step="0.1" value="0.7">
                </div>
            </div>
            
            <button onclick="generate()" id="generateBtn">🚀 Générer</button>
            <button onclick="clearOutput()" style="background: #999;">🗑️ Effacer</button>
            
            <div class="form-group" style="margin-top: 30px;">
                <label>Résultat:</label>
                <div id="output" class="output">Cliquez sur "Générer" pour commencer...</div>
            </div>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        
        // Update range values
        document.getElementById('maxLength').addEventListener('input', (e) => {
            document.getElementById('maxLengthValue').textContent = e.target.value;
        });
        document.getElementById('temperature').addEventListener('input', (e) => {
            document.getElementById('tempValue').textContent = e.target.value;
        });
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }
        
        async function generate() {
            const prompt = document.getElementById('prompt').value;
            const maxLength = parseInt(document.getElementById('maxLength').value);
            const temperature = parseFloat(document.getElementById('temperature').value);
            
            if (!prompt.trim()) {
                showStatus('❌ Veuillez entrer un prompt', 'error');
                return;
            }
            
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            
            showStatus(`<span class="spinner"></span> Génération en cours...`, 'loading');
            
            try {
                const response = await fetch(`${API_URL}/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        max_length: maxLength,
                        temperature: temperature,
                        top_p: 0.9
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                document.getElementById('output').textContent = data.generated_text;
                showStatus(`✅ ${data.tokens_generated} tokens générés`, 'success');
                
            } catch (error) {
                showStatus(`❌ Erreur: ${error.message}`, 'error');
                console.error('Error:', error);
            } finally {
                btn.disabled = false;
            }
        }
        
        function clearOutput() {
            document.getElementById('output').textContent = 'Résultat effacé';
            document.getElementById('prompt').value = 'Bonjour, ';
            document.getElementById('status').className = 'status';
        }
        
        // Allow Enter key to generate
        document.getElementById('prompt').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                generate();
            }
        });
    </script>
</body>
</html>
